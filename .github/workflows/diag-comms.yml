name: diag-comms
on:
  push:
    branches: [diag/comms-econnreset]
permissions:
  contents: read
jobs:
  shard3:
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --input-type=commonjs -e "require('electron')"
      - run: pnpm exec vitest run --shard=3/4 --reporter=default
